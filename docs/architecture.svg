<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant Codex Bridge least-privilege architecture</title>
  <desc id="desc">Architecture diagram showing a human operator and OpenAI service interacting with an isolated Ubuntu Codex VM. Codex uses Chrome and Playwright for Home Assistant UI testing, a local Git workspace for change tracking, and ha-sync for protected filesystem transport. ha-sync reaches the Home Assistant Codex Bridge over pinned TLS and bearer authentication. The bridge applies deny, read-only, and read-write policy before Home Assistant files. Browser access is a separate privilege boundary. SSH, root access, secret values, storage, databases, backups, and unrelated LAN access remain outside the normal Codex path.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .h1{font-size:38px;font-weight:750;fill:#0f172a}
      .sub{font-size:18px;font-weight:450;fill:#475569}
      .zoneTitle{font-size:14px;font-weight:800;letter-spacing:.08em;fill:#334155}
      .cardTitle{font-size:20px;font-weight:750;fill:#0f172a}
      .cardBody{font-size:14px;font-weight:450;fill:#475569}
      .tiny{font-size:12.5px;font-weight:500;fill:#64748b}
      .flowLabel{font-size:12.5px;font-weight:700;fill:#334155}
      .flowLabelBlue{font-size:12.5px;font-weight:700;fill:#1d4ed8}
      .flowLabelGreen{font-size:12.5px;font-weight:700;fill:#047857}
      .zone{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:28}
      .vmzone{fill:#f8fbff;stroke:#93c5fd;stroke-width:2;rx:28}
      .hazone{fill:#fbfdfb;stroke:#86efac;stroke-width:2;rx:28}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.3;rx:18;filter:url(#shadow)}
      .blueCard{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.4;rx:18}
      .greenCard{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4;rx:18}
      .amberCard{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.3;rx:16}
      .redCard{fill:#fff1f2;stroke:#fda4af;stroke-width:1.3;rx:16}
      .line{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .bi{stroke:#334155;stroke-width:2.3;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .blue{stroke:#2563eb;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}
      .bluebi{stroke:#2563eb;stroke-width:2.6;fill:none;marker-start:url(#arrowBlue);marker-end:url(#arrowBlue)}
      .green{stroke:#059669;stroke-width:2.6;fill:none;marker-end:url(#arrowGreen)}
      .dash{stroke-dasharray:7 7}
      .icon{stroke:#2563eb;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .iconGreen{stroke:#059669;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .iconSlate{stroke:#475569;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f1f5f9"/>
  <text x="64" y="66" class="h1">Home Assistant Codex Bridge</text>
  <text x="64" y="98" class="sub">Least-privilege edit, test, deploy, and Git workflow — secrets and host access stay outside the normal Codex path</text>

  <rect x="56" y="146" width="250" height="744" class="zone"/>
  <text x="80" y="179" class="zoneTitle">OPERATOR / EXTERNAL</text>

  <rect x="82" y="226" width="198" height="132" class="card"/>
  <circle cx="115" cy="262" r="19" fill="#e2e8f0"/>
  <path d="M106 267c0-8 18-8 18 0M115 258a6 6 0 1 0 0-12 6 6 0 0 0 0 12" class="iconSlate"/>
  <text x="142" y="258" class="cardTitle">Human operator</text>
  <text x="102" y="301" class="cardBody">Defines task and scope</text>
  <text x="102" y="325" class="tiny">Approves high-impact actions</text>

  <rect x="82" y="426" width="198" height="132" class="card"/>
  <circle cx="115" cy="462" r="19" fill="#e2e8f0"/>
  <path d="M104 466h22M109 458l6-6 6 6M115 452v20" class="iconSlate"/>
  <text x="142" y="458" class="cardTitle">OpenAI service</text>
  <text x="102" y="501" class="cardBody">Model traffic over Internet</text>
  <text x="102" y="525" class="tiny">No HA host credential required</text>

  <rect x="82" y="650" width="198" height="152" class="redCard"/>
  <text x="102" y="684" class="cardTitle">Blocked paths</text>
  <text x="102" y="714" class="cardBody">HAOS SSH / root</text>
  <text x="102" y="738" class="cardBody">Unrelated LAN hosts</text>
  <text x="102" y="762" class="cardBody">Databases / backups</text>
  <text x="102" y="786" class="cardBody">Secret values / .storage</text>

  <rect x="338" y="146" width="704" height="744" class="vmzone"/>
  <text x="366" y="179" class="zoneTitle">ISOLATED UBUNTU CODEX VM · WORK BOUNDARY</text>

  <rect x="378" y="226" width="270" height="150" class="blueCard"/>
  <circle cx="416" cy="264" r="20" fill="#dbeafe"/>
  <path d="M405 254h22v18h-22zM410 277h12M410 261l5 4-5 4M418 269h5" class="icon"/>
  <text x="450" y="262" class="cardTitle">Codex CLI</text>
  <text x="398" y="309" class="cardBody">Inspect · edit · validate · orchestrate</text>
  <text x="398" y="334" class="tiny">Task scope + exec policy</text>

  <rect x="716" y="226" width="286" height="150" class="card"/>
  <circle cx="754" cy="264" r="20" fill="#dbeafe"/>
  <rect x="743" y="507" width="22" height="16" rx="2" class="icon" opacity="0"/>
  <rect x="743" y="255" width="22" height="16" rx="2" class="icon"/>
  <path d="M747 276h14M754 271v5" class="icon"/>
  <text x="788" y="262" class="cardTitle">Chrome + Playwright</text>
  <text x="736" y="309" class="cardBody">Visible functional + visual testing</text>
  <text x="736" y="334" class="tiny">Dedicated HA account · separate privilege</text>

  <rect x="378" y="478" width="270" height="152" class="card"/>
  <circle cx="416" cy="516" r="20" fill="#e2e8f0"/>
  <path d="M406 510h20M406 518h20M411 502v32M421 502v32" class="iconSlate"/>
  <text x="450" y="514" class="cardTitle">Local Git workspace</text>
  <text x="398" y="560" class="cardBody">Home Assistant working mirror</text>
  <text x="398" y="584" class="tiny">diff · stage · commit known-good work</text>
  <text x="398" y="607" class="tiny">No remote is required by the design</text>

  <rect x="716" y="478" width="286" height="152" class="card"/>
  <circle cx="754" cy="516" r="20" fill="#dbeafe"/>
  <path d="M742 516h24M758 507l8 9-8 9M750 507l-8 9 8 9" class="icon"/>
  <text x="788" y="514" class="cardTitle">ha-sync</text>
  <text x="736" y="560" class="cardBody">Controlled filesystem transport</text>
  <text x="736" y="584" class="tiny">pull · push · list · mkdir · delete</text>
  <text x="736" y="607" class="tiny">Bearer token + pinned bridge CA</text>

  <rect x="378" y="694" width="624" height="114" class="amberCard"/>
  <text x="400" y="726" class="cardTitle">Protected local material</text>
  <text x="400" y="756" class="cardBody">Bridge token + pinned CA: ~/.config/codex-ha/</text>
  <text x="400" y="781" class="tiny">Routine shell access to OpenAI auth and browser profile/session data should remain denied.</text>

  <rect x="1074" y="146" width="470" height="744" class="hazone"/>
  <text x="1102" y="179" class="zoneTitle">HOME ASSISTANT OS · ENFORCEMENT BOUNDARY</text>

  <rect x="1110" y="226" width="398" height="126" class="greenCard"/>
  <circle cx="1148" cy="264" r="20" fill="#d1fae5"/>
  <path d="M1136 269v-16l12-8 12 8v16M1141 258h14M1141 264h14" class="iconGreen"/>
  <text x="1182" y="262" class="cardTitle">Home Assistant UI</text>
  <text x="1130" y="306" class="cardBody">Dashboards · Developer Tools · HACS · ESPHome</text>
  <text x="1130" y="330" class="tiny">Browser capability is independent of file-bridge policy</text>

  <rect x="1110" y="491" width="398" height="126" class="greenCard"/>
  <circle cx="1148" cy="529" r="20" fill="#d1fae5"/>
  <path d="M1138 528h20M1142 520h12v18h-12zM1134 528h8M1154 528h8" class="iconGreen"/>
  <text x="1182" y="527" class="cardTitle">Codex Bridge · HTTPS :8443</text>
  <text x="1130" y="571" class="cardBody">Authenticates, normalizes, confines every path request</text>
  <text x="1130" y="595" class="tiny">No SSH / SCP / SFTP bypass</text>

  <rect x="1110" y="662" width="398" height="126" class="greenCard"/>
  <circle cx="1148" cy="700" r="20" fill="#d1fae5"/>
  <path d="M1138 700l7 7 14-17M1135 688h26v24h-26z" class="iconGreen"/>
  <text x="1182" y="698" class="cardTitle">Protected path policy</text>
  <text x="1130" y="742" class="cardBody">DENY wins · explicit read-only / read-write rules</text>
  <text x="1130" y="766" class="tiny">Policy files remain outside Codex-writable paths</text>

  <rect x="1110" y="796" width="398" height="88" class="card"/>
  <text x="1130" y="822" class="cardTitle">/homeassistant filesystem</text>
  <text x="1130" y="844" class="tiny">RW · packages/codex · automations · scripts · scenes</text>
  <text x="1130" y="862" class="tiny">RW · ESPHome YAML   ·   RO · configuration · components · logs</text>
  <text x="1130" y="880" class="tiny">DENY · secrets · .storage · databases · backups · keys</text>

  <path d="M280 292 H378" class="line"/>
  <text x="300" y="278" class="flowLabel">task + approval</text>

  <path d="M280 492 C326 492 328 330 378 330" class="line dash"/>
  <text x="293" y="438" class="flowLabel">Internet</text>

  <path d="M513 376 V478" class="bi"/>
  <rect x="525" y="408" width="108" height="34" rx="9" fill="#f8fafc"/>
  <text x="539" y="430" class="flowLabel">edit / Git loop</text>

  <path d="M648 300 H716" class="line"/>
  <text x="659" y="286" class="flowLabel">browser tests</text>

  <path d="M648 554 H716" class="bluebi"/>
  <text x="654" y="539" class="flowLabelBlue">working tree</text>

  <path d="M1002 301 H1110" class="green"/>
  <text x="1016" y="286" class="flowLabelGreen">HTTPS UI</text>

  <path d="M1002 554 H1110" class="bluebi"/>
  <rect x="1007" y="509" width="98" height="34" rx="9" fill="#eff6ff"/>
  <text x="1020" y="530" class="flowLabelBlue">HTTPS :8443</text>

  <path d="M1309 617 V662" class="green"/>
  <text x="1324" y="644" class="flowLabelGreen">authorize</text>

  <path d="M1309 788 V796" class="green"/>

  <text x="1110" y="386" class="tiny">UI path and filesystem path are intentionally separate trust boundaries.</text>

  <rect x="56" y="918" width="1488" height="70" rx="20" fill="#0f172a"/>
  <text x="82" y="947" font-size="14" font-weight="800" fill="#e2e8f0" letter-spacing=".06em">DEFAULT NETWORK POSTURE</text>
  <text x="82" y="973" font-size="14" font-weight="550" fill="#cbd5e1">ALLOW: Internet HTTPS · Home Assistant UI · bridge TCP 8443</text>
  <text x="710" y="973" font-size="14" font-weight="550" fill="#fda4af">DENY: HAOS SSH/root · unrelated LAN · direct secret/database/backup access</text>
</svg>
